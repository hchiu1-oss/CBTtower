<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心智大逃脫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a dark, half-lit building descending floor by floor — elevator LED, CCTV monitors, a flashlit archive, a terminal-locked safe. One committed dark look. */
:root{
  --void:#07090D; --wall:#0F131A; --wall2:#161B24; --line:#272E3B; --text:#D9DEE7; --dim:#7F899B;
  --led:#FF3B30; --led-dim:#3B1512; --term:#5DF2A0; --term-dim:#123524; --exit:#3FD27A; --amber:#F4B942;
  --f-title:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-led:"Share Tech Mono","Noto Sans TC",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--text)}
body{font-family:var(--f-body);font-size:17px;line-height:1.65;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{margin:0;text-wrap:balance}
.led{font-family:var(--f-led);color:var(--led);text-shadow:0 0 10px rgba(255,59,48,.55)}
.term{font-family:var(--f-led);color:var(--term)}
.dim{color:var(--dim)}
.btn{background:var(--text);color:var(--void);border:0;border-radius:4px;padding:12px 20px;font-weight:700;letter-spacing:.04em}
.btn.red{background:var(--led);color:#fff}
.btn.green{background:var(--exit);color:#04140A}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.story{border-left:2px solid var(--amber);padding:4px 0 4px 14px;color:var(--text);max-width:62ch}
.story b{color:var(--amber)}
.hint{font-size:.88rem;color:var(--dim)}
.msg{padding:10px 14px;border-radius:4px;font-size:.95rem}
.msg.bad{background:var(--led-dim);color:#FFB3AD}
.msg.good{background:var(--term-dim);color:var(--term)}

/* elevator header */
.lift{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:linear-gradient(var(--void),rgba(7,9,13,.92));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.lift .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.floor{font-family:var(--f-led);font-size:2rem;line-height:1;color:var(--led);text-shadow:0 0 12px rgba(255,59,48,.6);background:#000;border:1px solid #2a0d0b;padding:6px 10px;min-width:3.4ch;text-align:center;border-radius:3px}
.liftname{display:grid;line-height:1.25}
.liftname b{font-size:1.05rem}
.liftname span{font-size:.8rem;color:var(--dim);font-family:var(--f-led);letter-spacing:.08em}
.alarms{display:flex;gap:6px;margin-left:auto;align-items:center}
.alarms i{width:16px;height:16px;border-radius:50%;background:#2A1311;border:1px solid #4a1d19;display:block}
.alarms i.on{background:var(--led);box-shadow:0 0 12px var(--led)}
.alarms small{font-family:var(--f-led);font-size:.72rem;color:var(--dim);margin-right:4px;letter-spacing:.1em}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:4px;padding:4px 8px;font-size:.8rem}
.remote{background:#2A1311;border:1px solid var(--led);color:#FFB3AD;border-radius:4px;padding:5px 10px;font-family:var(--f-led);font-size:.85rem;letter-spacing:.06em}
.remote.ready{background:var(--led);color:#fff;box-shadow:0 0 14px rgba(255,59,48,.5);animation:pulse 1.6s infinite}
.remote:disabled{opacity:.4;cursor:not-allowed;animation:none;box-shadow:none}
@keyframes pulse{50%{box-shadow:0 0 2px rgba(255,59,48,.2)}}
.streak{display:flex;gap:3px;align-items:center;font-family:var(--f-led);font-size:.72rem;color:var(--dim);letter-spacing:.08em}
.streak i{width:10px;height:10px;border-radius:2px;background:var(--line);display:block}
.streak i.on{background:var(--amber)}
.zappanel{border-top:1px solid var(--line);padding-block:10px}
.zappanel .in{display:grid;gap:8px}
.zapgrid{display:flex;flex-wrap:wrap;gap:8px}
.zapgrid button{background:var(--wall);border:1px solid var(--led);color:var(--text);border-radius:4px;padding:8px 12px;font-family:var(--f-led)}
.zapgrid button:disabled{border-color:var(--line);color:var(--dim);cursor:not-allowed}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);z-index:20;max-width:min(92vw,560px);padding:12px 18px;border-radius:6px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#toast.bad{background:var(--led);color:#fff}
#toast.good{background:var(--amber);color:#1a1205}
.feed{margin-top:16px;display:grid;gap:6px}
.feed div{font-size:.95rem;background:#1A1112;border:1px solid #4a1d19;border-radius:4px;padding:8px 12px}
.feed b{color:var(--led)}

/* shaft progress (team header) */
.shaft{display:flex;gap:3px;margin-top:6px}
.shaft span{flex:1;height:4px;background:var(--line);border-radius:2px}
.shaft span.done{background:var(--exit)}
.shaft span.now{background:var(--amber)}

/* stage frame */
.stage{display:grid;gap:18px;margin-top:20px}
.stage h1{font-family:var(--f-title);font-size:clamp(1.7rem,4.8vw,2.6rem);font-weight:900;letter-spacing:.02em}
.eyebrow{font-family:var(--f-led);color:var(--amber);letter-spacing:.18em;font-size:.82rem}

/* terminal */
.crt{background:#020604;border:1px solid #0f2a1c;border-radius:6px;padding:20px;font-family:var(--f-led);color:var(--term);position:relative;overflow:hidden;min-height:360px}
.crt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.25) 2px 4px);pointer-events:none}
.crt p{margin:0 0 8px;animation:appear .01s backwards}
@keyframes appear{from{opacity:0}to{opacity:0}}
.crt .warn{color:var(--led)}
.crt input{background:transparent;border:0;border-bottom:1px solid var(--term);color:var(--term);font-family:var(--f-led);font-size:1.2rem;padding:4px 2px;width:min(260px,100%);outline:none}
.crt .denied{color:var(--led);font-size:1.3rem;letter-spacing:.1em}
.cursor::after{content:"▌";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* CCTV */
.cams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cam{background:var(--wall);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:8px;align-content:start;position:relative}
.cam-h{display:flex;justify-content:space-between;font-family:var(--f-led);font-size:.78rem;color:var(--dim);letter-spacing:.1em}
.cam-h .rec{color:var(--led)}
.cam-h .rec::before{content:"● ";animation:blink 1.4s steps(1) infinite}
.cam-sit{font-weight:700;font-size:1.05rem;padding:10px;background:repeating-linear-gradient(0deg,#141a22 0 3px,#10151c 3px 6px);border-radius:3px}
.slot{border:1px dashed var(--line);border-radius:3px;padding:8px 10px;min-height:58px;text-align:left;background:transparent;font-size:.92rem;display:block;width:100%}
.slot .k{display:block;font-family:var(--f-led);font-size:.7rem;color:var(--dim);letter-spacing:.12em}
.slot.target{border-color:var(--amber);background:rgba(244,185,66,.06)}
.slot.filled{border-style:solid;border-color:var(--exit);background:rgba(63,210,122,.07)}
.slot.shake{animation:shake .35s;border-color:var(--led)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ev{background:#E9E4D6;color:#1B1A17;border:0;border-radius:2px;padding:10px 12px;text-align:left;font-size:.95rem;box-shadow:0 2px 0 #000;position:relative}
.ev .k{display:block;font-family:var(--f-led);font-size:.7rem;letter-spacing:.1em;color:#7A2A20}
.ev[aria-pressed="true"]{outline:3px solid var(--amber);transform:translateY(-2px)}

/* flashlight archive */
.dark{position:relative;height:clamp(440px,62vh,560px);background:#0B0D11;border:1px solid var(--line);border-radius:4px;overflow:hidden;touch-action:none;--x:50%;--y:50%;
  background-image:repeating-linear-gradient(90deg,transparent 0 120px,rgba(255,255,255,.015) 120px 122px)}
.dark .note-w{position:absolute;width:min(44%,300px);background:transparent;border:0;text-align:left;font-family:var(--f-title);font-weight:700;font-size:clamp(.95rem,2.4vw,1.15rem);color:#E8DCC0;padding:6px 8px;line-height:1.4;z-index:1}
.dark .note-w.pinned{z-index:3;background:rgba(244,185,66,.14);outline:1px solid var(--amber);color:#FFE7B3}
.dark .note-w.pinned::before{content:"";position:absolute;top:-6px;left:-6px;width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.beam{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(255,236,190,.06) 0,rgba(0,0,0,0) 80px,rgba(3,4,6,.965) 135px)}
.lamp{position:absolute;right:12px;bottom:10px;z-index:4;font-family:var(--f-led);font-size:.75rem;color:var(--dim)}

/* interview */
.qs{display:grid;gap:8px}
.q{background:var(--wall);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left;width:100%}
.q.asked{border-color:var(--exit)}
.q.asked.bad{border-color:var(--led)}
.q .a{display:block;margin-top:8px;color:var(--text);font-size:.95rem}
.q .fb{display:block;margin-top:6px;color:#FFB3AD;font-size:.88rem}
.bag{background:#1A1712;border:1px solid #3a3122;border-radius:4px;padding:12px 14px}
.bag h3{font-family:var(--f-led);font-size:.8rem;letter-spacing:.14em;color:var(--amber);margin-bottom:6px}
.bag ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.sup{border:1px solid var(--led);border-radius:4px;padding:10px 14px;font-size:.92rem}
.sup b{color:var(--led)}

/* safe */
.safe{background:radial-gradient(circle at 50% 30%,#2A2F38,#12151B 70%);border:1px solid #3a404c;border-radius:10px;padding:24px;display:grid;gap:18px;justify-items:center}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
.dial{display:grid;gap:8px;justify-items:center;text-align:center}
.dial .lab{font-family:var(--f-led);color:var(--amber);letter-spacing:.14em;font-size:.82rem}
.dial .face{background:#050607;border:2px solid #4a5160;border-radius:8px;min-height:96px;width:100%;display:grid;place-items:center;padding:10px;font-weight:700;font-size:1rem;color:var(--term);font-family:var(--f-led);box-shadow:inset 0 0 18px rgba(0,0,0,.8)}
.dial button{background:#262B35;border:1px solid #4a5160;border-radius:4px;width:56px;height:34px;color:var(--text)}
.safe.open{border-color:var(--exit);box-shadow:0 0 40px rgba(63,210,122,.25)}

/* exit */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{min-height:120px;border-radius:6px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,#141922 0 8px,#10141B 8px 16px);font-family:var(--f-led);color:var(--dim);display:grid;place-items:center;padding:12px;text-align:center}
.sc.up{background:#0F2117;border-color:var(--exit);color:#CFF5DD;font-family:var(--f-body);font-weight:500}
.opts{display:grid;gap:8px}
.opt{background:var(--wall);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left}
.opt.no{border-color:var(--led)}
.opt .fb{display:block;font-size:.88rem;margin-top:6px;color:#FFB3AD}

/* escaped */
.exitsign{display:inline-block;background:var(--exit);color:#04140A;font-weight:900;font-family:var(--f-led);letter-spacing:.2em;padding:6px 14px;border-radius:3px;box-shadow:0 0 24px rgba(63,210,122,.45)}
.ccd{display:grid;gap:6px;background:var(--wall);border:1px solid var(--line);border-radius:6px;padding:18px}
.ccd .t{border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.ccd .t .k{display:block;font-family:var(--f-led);font-size:.72rem;letter-spacing:.12em;color:var(--amber)}
.ccd .t.core{border-color:var(--led)}
.ccd .ar{text-align:center;color:var(--dim);font-size:.8rem;line-height:1}
.ccd ul{margin:0;padding-left:1.1em}
.sits3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

/* lockdown */
.lock{border:2px solid var(--led);border-radius:6px;padding:22px;display:grid;gap:16px;background:linear-gradient(180deg,rgba(255,59,48,.10),transparent 60%)}
.siren{animation:siren 1.2s infinite}
@keyframes siren{50%{background-color:rgba(255,59,48,.18)}}
.fld{display:grid;gap:6px}
.fld label{font-weight:700}
.rng{display:flex;gap:12px;align-items:center}
.rng input{flex:1;accent-color:var(--led);max-width:360px}
.rng output{font-family:var(--f-led);font-size:1.4rem;min-width:4ch;color:var(--amber)}
select.sel{background:var(--wall);border:1px solid var(--line);border-radius:4px;padding:10px;max-width:100%}

/* surprise */
.win{position:relative;overflow:hidden;border:2px solid var(--amber);border-radius:10px;padding:32px 24px;display:grid;gap:18px;justify-items:center;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(244,185,66,.22),transparent 65%)}
.win h1{font-size:clamp(2.6rem,10vw,4.6rem);color:var(--amber);text-shadow:0 0 28px rgba(244,185,66,.55)}
.win .story{border:0;padding:0;text-align:center;max-width:44ch}
.conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
.gift{width:min(220px,60vw);aspect-ratio:1;border:0;border-radius:12px;background:linear-gradient(90deg,transparent 44%,var(--amber) 44% 56%,transparent 56%),linear-gradient(var(--led),#B5241B);position:relative;box-shadow:0 12px 40px rgba(255,59,48,.35);animation:wobble 1.4s ease-in-out infinite}
.gift::before{content:"";position:absolute;left:-6%;right:-6%;top:-12%;height:26%;border-radius:8px;background:linear-gradient(90deg,#C42B21 44%,var(--amber) 44% 56%,#C42B21 56%)}
.gift span{position:absolute;inset:auto 0 -2.2em;font-family:var(--f-led);color:var(--amber);letter-spacing:.14em;font-size:.9rem}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.reveal-big{font-family:var(--f-title);font-size:clamp(2rem,7vw,3.4rem);font-weight:900;color:var(--text);line-height:1.3}
.reveal-big b{color:var(--led)}
.lock.bonus{border-color:var(--amber);background:linear-gradient(180deg,rgba(244,185,66,.12),transparent 60%);animation:none}
.btn.gold{background:var(--amber);color:#1a1205}
.surprise-box{margin-top:16px;border:1px solid var(--amber);border-radius:6px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* lobby */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.teams button{background:var(--wall);border:1px solid var(--line);border-radius:4px;padding:18px 10px;font-family:var(--f-led);font-size:1.4rem}
.teams button:hover{border-color:var(--amber);color:var(--amber)}

/* host */
.host-top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:end;justify-content:space-between}
.clock{font-family:var(--f-led);font-size:clamp(3rem,9vw,5.5rem);line-height:1;color:var(--led);text-shadow:0 0 18px rgba(255,59,48,.55)}
.clock.ok{color:var(--exit);text-shadow:0 0 18px rgba(63,210,122,.4)}
.board{display:grid;gap:10px;margin-top:22px}
.trow{display:grid;grid-template-columns:110px minmax(0,1fr) 150px;gap:16px;align-items:center;background:var(--wall);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.trow.locked{border-color:var(--led)}
.trow.won{border-color:var(--exit)}
.tname{font-family:var(--f-led);font-size:1.4rem}
.tname small{display:block;font-size:.7rem;color:var(--dim);letter-spacing:.1em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:2px}
.dot.on{background:var(--exit);box-shadow:0 0 8px var(--exit)}
.segs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.seg{height:30px;border-radius:3px;background:#1B212B;font-family:var(--f-led);font-size:.8rem;display:grid;place-items:center;color:var(--dim)}
.seg.done{background:#174D31;color:#BFF3D3}
.seg.now{background:var(--amber);color:#1a1205}
.trow.locked .seg.now{background:var(--led);color:#fff}
.tstat{font-size:.92rem;text-align:right}
.tstat .al{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.tstat .al i{width:10px;height:10px;border-radius:50%;background:#2A1311;display:block}
.tstat .al i.on{background:var(--led)}
.manual{display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.manual button{background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--dim);font-size:.75rem;padding:0 6px}
.results{margin-top:28px;background:var(--wall);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
.results svg{width:100%;height:auto;display:block}
.results ol{margin:0;padding-left:1.2em;display:grid;gap:8px}
.legend{display:flex;gap:14px;font-size:.85rem;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.foot{margin-top:30px;font-size:.8rem;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.foot button{background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--dim);padding:4px 10px;font-size:.8rem}

@media (max-width:760px){
  .cams,.dials,.sits3{grid-template-columns:minmax(0,1fr)}
  .trow{grid-template-columns:minmax(0,1fr)}
  .tstat{text-align:left}.tstat .al,.manual{justify-content:flex-start}
  .results{grid-template-columns:minmax(0,1fr)}
  .dial .face{min-height:64px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.crt p{opacity:1}}

/* v2 additions */
.ev.big{font-size:1.15rem;padding:16px 18px;box-shadow:0 4px 0 #000}
.camgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cambtn{background:var(--wall);border:1px solid var(--amber);border-radius:6px;padding:12px;text-align:left;display:grid;gap:4px;min-height:84px}
.cambtn .k{font-family:var(--f-led);color:var(--amber);font-size:.78rem;letter-spacing:.12em}
.cambtn b{font-size:1rem;line-height:1.35}
.camsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.camsum .cam{gap:4px;padding:10px}
.camsum .row3{font-size:.85rem;border-top:1px dashed var(--line);padding-top:4px}
.camsum .row3 .k{font-family:var(--f-led);font-size:.68rem;color:var(--dim);letter-spacing:.1em;display:block}
.camsum .row3.ok{color:#CFF5DD}
.prog{font-family:var(--f-led);color:var(--dim);letter-spacing:.1em;font-size:.85rem}
.file{background:#ECE6D6;color:#1E1B16;border-radius:4px;padding:22px 20px;display:grid;gap:14px;box-shadow:0 6px 0 #000;position:relative}
.file h2{font-family:var(--f-title);font-size:1.5rem}
.file .stamp{position:absolute;right:16px;top:16px;border:2px solid #A3261C;color:#A3261C;font-family:var(--f-led);padding:2px 8px;letter-spacing:.14em;transform:rotate(6deg);font-size:.8rem}
.file dl{display:grid;grid-template-columns:7em minmax(0,1fr);gap:6px 12px;margin:0}
.file dt{font-weight:700;color:#6B2B22}
.file dd{margin:0}

   c.on('reconnect',()=>{upd();netEmit();});

function caseFile(){return`<article class="file" aria-label="Stan 的個案檔案"><span class="stamp">CONFIDENTIAL</span>
 <h2>個案檔案 #07：Stan</h2>
 <dl><dt>基本資料</dt><dd>35 歲男性，建築工人；兼職大學生，心理系大三。離過婚，常覺得自己是個「獨行俠」。</dd>
 <dt>轉介原因</dt><dd>酒駕被判刑，法官要求他接受專業協助。他承認自己有問題，但不認為自己酒精成癮。</dd></dl>
 <h3>主訴（他自己說的）</h3>
 <ul><li>不知道怎麼和人親近，社交時很害怕；喝了酒，事情就沒那麼排山倒海。</li>
 <li>在有魅力的女性面前緊張、冒冷汗，覺得她們看他「不夠男人」。</li>
 <li>常常焦慮、愧疚，覺得浪費了大半人生、讓別人失望，常貶低自己。</li>
 <li>有時覺得自己「好像正在死去」，想過自殺。</li></ul>
 <h3>他想要的</h3>
 <ul><li>喜歡自己多一點，不靠喝酒也能感覺好。</li><li>不再害怕女性，學會信任別人。</li><li>成為幫助問題青少年的諮商師。</li></ul>

 <p class="hint" style="color:#5b5245;margin:0">資料來源：Corey《諮商與心理治療理論與實務》第 1 章 Stan 個案</p></article>`;}

  saveT();renderTeam();return;}
 if(a==='pin'){const i=+el.dataset.i,p=T.s2.pins,k=p.indexOf(i);if(k>=0)p.splice(k,1);else if(p.length<4)p.push(i);T.s2.msg=null;saveT();renderTeam();return;}
 if(a==='pinsub'){const wrong=T.s2.pins.filter(i=>!RULES[i].ok).length;if(!wrong){T.s2.done=true;sfx.open();good();}else{T.s2.msg={k:'bad',t:`有 ${wrong} 句不是 Stan 的規則。提示：Stan 非常在意別人怎麼看他，也很怕失敗。警報燈亮了一盞。`};strike();}saveT();renderTeam();return;}
 if(a==='ask'){const id=el.dataset.id;if(T.s3.asked.includes(id))return;T.s3.asked.push(id);const q=QS.find(q=>q.id===id);if(q.bad)strike();else{sfx.ok();good();}saveT();renderTeam();return;}
 if(a==='dial'){const i=+el.dataset.i,n=DIALS[i].o.length;T.s4.d[i]=(T.s4.d[i]+ +el.dataset.d+n)%n;T.s4.msg=null;tone([[300,.04,'square']]);saveT();renderTeam();return;}
 if(a==='crack'){const right=DIALS.filter((d,i)=>T.s4.d[i]===d.ok).length;if(right===3){T.s4.open=true;sfx.open();good();}else{T.s4.msg={k:'bad',t:`喀。只有 ${right} 個轉盤對了。回頭看表層的自動想法和樓梯間問到的早年經驗。警報燈亮了一盞。`};strike();}saveT();renderTeam();return;}
 if(a==='flip'){if(T.s5.flip.length>=2)return;const idx=STR.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}T.s5.flip=idx.slice(0,2);sfx.open();saveT();renderTeam();return;}
 if(a==='exp'){const i=+el.dataset.i;if(T.s5.wrong.includes(i))return;if(EXP[i].ok){T.stage=6;T.finishedAt=Date.now();sfx.open();good();}else{T.s5.wrong.push(i);strike();}saveT();renderTeam();window.scrollTo(0,0);return;}
 if(a==='penskip'){const p=T.pen;if(!p)return;p.who=nextWho(p.who);p.phase=0;p.pred='';p.act='';p.pre=70;p.post=30;penProxy=false;saveT();renderTeam();window.scrollTo(0,0);return;}
 if(a==='penproxy'){penProxy=true;renderTeam();return;}
 if(a==='pengo'){T.pen.phase=1;saveT();renderTeam();return;}
 if(a==='pendone'){const p=T.pen;T.toilet.push({pre:p.pre,post:p.post,lv:p.lv||0,w:p.who||''});penProxy=false;const wasBonus=!!p.surprise;T.pen=null;T.locked=false;if(!wasBonus)T.strikes=0;sfx.open();T.hush=1;saveT();renderTeam();window.scrollTo(0,0);return;}
});
document.addEventListener('keydown',e=>{if(mode()!=='host'||showIdx<0)return;
 if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();const n=awards().length;if(showIdx<n){showIdx++;sfx.open();renderHost();}}
 else if(e.key==='ArrowLeft'){showIdx=Math.max(0,showIdx-1);renderHost();}
 else if(e.key==='Escape'){showIdx=-1;renderHost();}});
document.addEventListener('keydown',e=>{if(mode()==='host'&&showRules&&showIdx<0&&e.key==='Escape'){showRules=false;renderHost();}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.a==='ctr'&&CT){CT[el.dataset.k]=+el.value;const o=el.nextElementSibling;if(o)o.textContent=el.value;ls.set('tower-ct',CT);return;}if(el.dataset.a==='pen'&&T&&T.pen){T.pen[el.dataset.k]=+el.value;const o=el.nextElementSibling;if(o)o.textContent=el.value;}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.a==='pensel'&&T&&T.pen){T.pen[el.dataset.k]=el.value;saveT();renderTeam();}
 else if(el.dataset.a==='pen'&&T){saveT();}
 else if(el.dataset.a==='ctr'&&CT){saveCT();}
 else if(el.dataset.a==='cts'&&CT){CT[el.dataset.k]=el.value;saveCT();renderTeam();}
 else if(el.dataset.a==='dur'){H.dur=+el.value;saveH();hostPresence();renderHost();}
 else if(el.dataset.a==='mem'){H.mem=+el.value;saveH();hostPresence();renderHost();}
});
enterMode();
})();
</script>
